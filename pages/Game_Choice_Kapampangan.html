<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapampangan Quiz</title>

    <style>
        @font-face {
            font-family: "bright DEMO";
            src: url('../assets/fonts/BrightDemo.otf') format('opentype');
            font-weight: normal;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Georgia", serif;
        }


        body {
            background-color: #fff8df;
        }


        /* ================= SIDEBAR STYLES ================= */
        .sidebar {
            width: 100px;
            height: 100vh;
            background: #ffffff;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            gap: 20px;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
        }


        .sidebar ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
            width: 100%;
        }


        .sidebar ul li {
            width: 100%;
            margin-bottom: 35px;
            text-align: center;
        }


        .sidebar ul li a {
            color: #e59d2c;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 10px 0;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }


        .sidebar ul li a:hover {
            transform: scale(1.15);
            background-color: #fff8df;
            color: #8a3b08;
        }


        .sidebar ul li a .material-icons {
            font-size: 36px;
            transition: transform 0.3s ease;
        }


        .sidebar ul li a:hover .material-icons {
            transform: rotate(-5deg);
        }


        .icon {
            width: 80px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }


        .icon img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }


        .nav-label {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: "Georgia", sans-serif;
            letter-spacing: 1px;
        }


        /* ================= GAME CONTENT STYLES ================= */
        .container {
            flex: 1;
            margin-left: 100px;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
        }


        h1 {
            font-size: 48px;
            font-family: bright DEMO, arial;
            color: #2e4365;
            margin-bottom: 25px;
            text-align: left;
        }


        .progress-container {
            position: relative;
            width: 80%;
            margin: 0 auto 40px auto;
        }


        .progress-bar {
            width: 100%;
            height: 35px;
            border-radius: 25px;
            border: 6px solid #e3c177;
            background: #ffffff;
            overflow: hidden;
        }


        .progress {
            height: 100%;
            width: 0%;
            background: #8c3b06;
            border-radius: 25px;
            transition: width 0.3s ease;
        }


        .score {
            position: absolute;
            top: -30px;
            right: 10px;
            font-weight: bold;
            color: #2e4365;
            font-size: 18px;
        }


        .plus-one {
            position: absolute;
            right: 50px;
            top: -10px;
            font-size: 20px;
            color: #27ae60;
            animation: floatUp 1s ease forwards;
        }


        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }


            100% {
                opacity: 0;
                transform: translateY(-30px);
            }
        }


        .instructions p {
            font-size: 20px;
            margin-bottom: 20px;
        }


        .question-box {
            background: #fff;
            border: 2px solid #a66f28;
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
            width: 100%;
        }


        .question-box h4 {
            color: #a66f28;
            margin-bottom: 15px;
            font-size: 30px;
            font-family: bright DEMO, arial;
        }


        #questionText {
            color: #2e4365;
            font-size: 28px;
            margin-bottom: 25px;
        }


        .options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }


        .opt-btn {
            padding: 20px;
            border: 2px solid #a66f28;
            border-radius: 12px;
            background-color: #fff;
            color: #a66f28;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
        }


        .opt-btn:hover:not(:disabled) {
            background-color: #f2ebbb;
            transform: translateY(-2px);
        }


        .correct {
            background: #b9f9c8 !important;
            color: #155724 !important;
            border-color: #28a745 !important;
        }


        .wrong {
            background: #f8d7da !important;
            color: #721c24 !important;
            border-color: #dc3545 !important;
        }


        .hint-box {
            background: #ffffff;
            border: 4px solid #e3c177;
            border-radius: 15px;
            margin: 20px auto;
            padding: 15px 30px;
            display: none;
            width: fit-content;
        }


        .button-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-bottom: 20px;
        }


        .btn {
            padding: 12px 30px;
            background: #8c3b06;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            margin-right: 10px;
        }


        .nav-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #2e4365;
            color: white;
            font-size: 24px;
            border: none;
            cursor: pointer;
            box-shadow: 2px 2px 0px #f28c28;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #congratsScreen::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../assets/images/green1.png');
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            z-index: -1;
        }

        .congrats {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            width: 750px;
            height: auto;
            padding: 40px 20px;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .card-gif {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .card-img {
            height: 200px;
            z-index: 1;
        }

        .card p {
            z-index: 2;
            position: relative;
        }

        .card h1 {
            font-size: 50px;
            color: #2e4365;
            z-index: 2;
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .button {
            background-color: #2e4365;
            width: 130px;
            height: 45px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .restart-btn {
            background-color: #8c3b06;
        }

        .button p {
            color: #fff;
        }

        /* Score styling in Congrats Card */
        #finalScore {
            font-size: 32px;
            color: #8c3b06;
            font-weight: bold;
            z-index: 2;
            margin: 0;
        }

        #congratsScreen {
            position: fixed;
            top: 0;
            left: 100px;
            width: calc(100vw - 100px);
            height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff8df;
            z-index: 200;
        }
    </style>
</head>


<body>
    <div class="sidebar">
        <div class="icon">
            <img src="../assets/images/salinify.png" alt="Salin Icon">
        </div>
        <ul>
            <li><a href="home.html"><span class="material-icons">home</span><span class="nav-label">Home</span></a></li>
            <li><a href="classes.html"><span class="material-icons">school</span><span
                        class="nav-label">Origin</span></a></li>
            <li><a href="learn-ui.html"><span class="material-icons">menu_book</span><span
                        class="nav-label">Dialect</span></a></li>
            <li><a href="play-ui.html"><span class="material-icons">sports_esports</span><span
                        class="nav-label">Play</span></a></li>
        </ul>
    </div>


    <div class="container" id="quizContainer">
        <h1>Kapampangan</h1>


        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="score" id="score">0 / 20</div>
        </div>


        <div class="instructions">
            <p>Instructions: Choose the correct answer for each question.</p>
        </div>


        <div class="question-box">
            <h4>Question:</h4>
            <p id="questionText">---</p>
            <div class="options">
                <button class="opt-btn" id="opt1"></button>
                <button class="opt-btn" id="opt2"></button>
                <button class="opt-btn" id="opt3"></button>
                <button class="opt-btn" id="opt4"></button>
            </div>
        </div>


        <div class="hint-box">
            <p class="hint-text" id="hintDisplay"></p>
        </div>


        <div class="button-row">
            <div class="action-btns">
                <button class="btn" id="hintBtn">HINT</button>
                <button class="btn" id="revealBtn">REVEAL</button>
            </div>
            <div class="nav-buttons" style="display: flex; gap: 15px;">
                <button class="nav-btn" id="prevBtn">&lt;</button>
                <button class="nav-btn" id="nextBtn">&gt;</button>
            </div>
        </div>
    </div>


    <div id="congratsScreen">
        <div class="congrats">

            <div class="card">
                <img src="../assets/images/confetti.gif" class="card-gif" />
                <img src="../assets/images/sali_congrats.png" class="card-img" />

                <h1>Congratulations!</h1>
                <p id="finalScore">Score: 0 / 20</p>
                <p>You did a great job on this game.</p>
            </div>

            <audio id="congratsSound" src="../assets/audio/congrats.mp3" preload="auto"></audio>

            <div class="button-group">
                <div class="button restart-btn" onclick="restartGame()">
                    <p>Restart</p>
                </div>
                <div class="button" onclick="window.location.href='play-ui.html'">
                    <p>Back</p>
                </div>
            </div>

        </div>
    </div>


    <audio id="correctSound" src="../assets/audio/correct.mp3" preload="auto">
        <audio id="wrongSound" src="../assets/audio/wrong.mp3" preload="auto">
            <audio id="hintSound" src="../assets/audio/hint.mp3" preload="auto">
                <audio id="revealSound" src="../assets/audio/reveal.mp3" preload="auto">
                    <audio id="congratsSound" src="../assets/audio/congrats.mp3" preload="auto">


                        <script>
                            let originalQuestions = [];

                            async function fetchQuestions() {
                                try {
                                    const response = await fetch(
                                        "../api/quizzes.php?dialect=Kapampangan&type=Choice"
                                    );

                                    if (!response.ok) {
                                        throw new Error("Failed to fetch questions");
                                    }

                                    const data = await response.json();

                                    originalQuestions = data.map(q => ({
                                        text: q.question,
                                        options: q.options.map(opt => opt.text),
                                        correct: q.options.findIndex(
                                            opt => Number(opt.is_correct) === 1
                                        ),
                                        hint: q.hint
                                    }));

                                    if (
                                        originalQuestions.length === 0 ||
                                        originalQuestions.some(q =>
                                            q.correct === -1 ||
                                            q.options.length !== 4
                                        )
                                    ) {
                                        throw new Error("Invalid or missing quiz data");
                                    }

                                    console.log(
                                        "Kapampangan questions loaded:",
                                        originalQuestions.length
                                    );

                                    return true;

                                } catch (error) {
                                    console.error("Error loading questions:", error);
                                    return false;
                                }
                            }

                            const roman = ["", "I", "II", "III"];
                            let hintCount = 3;
                            let revealCount = 3;
                            let questions = [];
                            let currentQ = 0;
                            let gameState = [];

                            const optBtns = [
                                document.getElementById("opt1"),
                                document.getElementById("opt2"),
                                document.getElementById("opt3"),
                                document.getElementById("opt4")
                            ];

                            function shuffleArray(array) {
                                let currentIndex = array.length, randomIndex;
                                while (currentIndex != 0) {
                                    randomIndex = Math.floor(Math.random() * currentIndex);
                                    currentIndex--;
                                    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                                }
                                return array;
                            }

                            function loadQ() {
                                const q = questions[currentQ];
                                const state = gameState[currentQ];

                                document.getElementById("hintBtn").innerHTML = `Hint: ${roman[hintCount]}`;
                                document.getElementById("revealBtn").innerHTML = `Reveal: ${roman[revealCount]}`;

                                document.getElementById("hintBtn").disabled = hintCount === 0;
                                document.getElementById("revealBtn").disabled = revealCount === 0 || state.answered;

                                if (hintCount === 0) document.getElementById("hintBtn").style.opacity = "0.5";
                                else document.getElementById("hintBtn").style.opacity = "1";

                                if (revealCount === 0 || state.answered) document.getElementById("revealBtn").style.opacity = "0.5";
                                else document.getElementById("revealBtn").style.opacity = "1";

                                document.getElementById("questionText").textContent = q.text;

                                if (!state.shownHint) {
                                    document.querySelector('.hint-box').style.display = "none";
                                    document.getElementById('hintDisplay').textContent = "";
                                }

                                optBtns.forEach((btn, i) => {
                                    btn.textContent = q.options[i];
                                    btn.className = "opt-btn";
                                    btn.disabled = state.answered;

                                    if (state.answered || state.revealed) {
                                        if (i === q.correct) {
                                            btn.classList.add("correct");
                                        }
                                        if (state.userChoice === i && state.userChoice !== q.correct) {
                                            btn.classList.add("wrong");
                                        }
                                    }
                                });

                                document.getElementById("prevBtn").disabled = currentQ === 0;

                                const nextBtn = document.getElementById("nextBtn");
                                nextBtn.disabled = !state.answered;
                                if (nextBtn.disabled) {
                                    nextBtn.style.opacity = "0.5";
                                } else {
                                    nextBtn.style.opacity = "1";
                                }

                                updateScore();
                                updateProgress();
                            }

                            function checkAns(choice) {
                                const q = questions[currentQ];
                                const state = gameState[currentQ];

                                if (state.answered) return;

                                if (choice === q.correct) {
                                    document.getElementById("correctSound").play().catch(() => { });
                                    state.userChoice = choice;
                                    state.answered = true;
                                    optBtns.forEach(btn => btn.disabled = true);
                                    optBtns[choice].classList.add("correct");

                                    if (state.wrongAttempts === 0 && !state.revealed) {
                                        const plusOne = document.createElement('div');
                                        plusOne.className = "plus-one";
                                        plusOne.textContent = "+1";
                                        document.querySelector('.progress-container').appendChild(plusOne);
                                        setTimeout(() => plusOne.remove(), 1000);
                                    }

                                    setTimeout(() => {
                                        if (currentQ < questions.length - 1) {
                                            currentQ++;
                                            loadQ();
                                        } else {
                                            showCongrats();
                                        }
                                    }, 1500);

                                } else {
                                    document.getElementById("wrongSound").play().catch(() => { });
                                    optBtns[choice].classList.add("wrong");
                                    optBtns[choice].disabled = true;
                                    state.wrongAttempts++;
                                }

                                updateScore();
                                updateProgress();
                            }

                            function revealAnswer() {
                                if (revealCount <= 0) return;
                                document.getElementById("revealSound").play().catch(() => { });
                                revealCount--;

                                const q = questions[currentQ];
                                const state = gameState[currentQ];

                                state.revealed = true;
                                optBtns[q.correct].classList.add("correct");

                                updateScore();
                                updateProgress();
                            }

                            function updateScore() {
                                let score = gameState.filter(s =>
                                    s.answered &&
                                    !s.revealed &&
                                    s.wrongAttempts === 0 &&
                                    s.userChoice === questions[gameState.indexOf(s)].correct
                                ).length;

                                document.getElementById("score").textContent = `${score} / ${questions.length}`;
                                return score;
                            }

                            function updateProgress() {
                                const answered = gameState.filter(s => s.answered).length;
                                const percent = (answered / questions.length) * 100;
                                document.getElementById("progress").style.width = percent + "%";
                            }

                            function showHint() {
                                if (hintCount <= 0) return;
                                document.getElementById("hintSound").play().catch(() => { });
                                hintCount--;

                                const state = gameState[currentQ];
                                state.shownHint = true;

                                const hintBox = document.querySelector('.hint-box');
                                document.getElementById('hintDisplay').textContent = "Hint: " + questions[currentQ].hint;
                                hintBox.style.display = "block";

                                document.getElementById('hintBtn').innerHTML = `Hint: ${roman[hintCount]}`;
                                document.getElementById('hintBtn').disabled = hintCount === 0;
                                if (hintCount === 0) document.getElementById('hintBtn').style.opacity = "0.5";
                            }

                            function showCongrats() {
                                const screen = document.getElementById("congratsScreen");
                                const finalScoreText = document.getElementById("finalScore");

                                const totalScore = updateScore();
                                finalScoreText.innerText = `Score: ${totalScore} / ${questions.length}`;

                                screen.style.display = "flex";
                                const sound = document.getElementById("congratsSound");
                                sound.play().catch(() => { });
                            }

                            function restartGame() {
                                hintCount = 3;
                                revealCount = 3;
                                questions = shuffleArray([...originalQuestions]);
                                currentQ = 0;
                                gameState = questions.map(() => ({
                                    answered: false,
                                    userChoice: -1,
                                    revealed: false,
                                    shownHint: false,
                                    wrongAttempts: 0
                                }));

                                document.getElementById("congratsScreen").style.display = "none";
                                document.getElementById("quizContainer").style.display = "flex";
                                document.getElementById("progress").style.width = "0%";
                                document.getElementById("score").textContent = `0 / ${questions.length}`;

                                loadQ();
                            }

                            optBtns.forEach((btn, i) => btn.addEventListener("click", () => checkAns(i)));
                            document.getElementById("hintBtn").addEventListener("click", showHint);
                            document.getElementById("revealBtn").addEventListener("click", revealAnswer);

                            document.getElementById("nextBtn").addEventListener("click", () => {
                                if (!document.getElementById("nextBtn").disabled && currentQ < questions.length - 1) {
                                    currentQ++;
                                    loadQ();
                                }
                            });

                            document.getElementById("prevBtn").addEventListener("click", () => {
                                if (currentQ > 0) {
                                    currentQ--;
                                    loadQ();
                                }
                            });

                            window.onload = async () => {
                                const success = await fetchQuestions();

                                if (!success) {
                                    alert("Unable to load Kapampangan quiz questions.");
                                    return;
                                }

                                restartGame();
                            };
                        </script>

</body>

</html>
