<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapampangan Flashcards</title>
    <style>
        @font-face {
            font-family: "bright DEMO";
            src: url('../assets/fonts/BrightDemo.otf') format('opentype');
            font-weight: normal;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff8df;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .learn_pampanga {
            font-family: "Georgia", sans-serif;
            background: #fff8df;
            padding: 30px 50px;
            padding-left: 140px;
            height: 100vh;
            overflow-y: auto;
            position: relative;
            transform: translateY(100%);
            transition: transform 0.6s ease;
            z-index: 5;
        }

        .learn_pampanga.show {
            transform: translateY(0);
        }

        /* SIDEBAR STYLES */
        .sidebar {
            width: 100px;
            height: 100vh;
            background: #ffffff;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            gap: 20px;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
        }

        .sidebar .icon {
            width: 80px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .sidebar .icon img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
            width: 100%;
        }

        .sidebar ul li {
            width: 100%;
            margin-bottom: 35px;
            text-align: center;
        }

        .sidebar ul li a {
            color: #e59d2c;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 10px 0;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Sidebar Hover Effect */
        .sidebar ul li a:hover {
            transform: scale(1.15);
            background-color: #fff8df;
            color: #8a3b08;
        }

        .sidebar ul li a .material-icons {
            font-size: 36px;
            transition: transform 0.3s ease;
        }

        .sidebar ul li a:hover .material-icons {
            transform: rotate(-5deg);
        }

        .nav-label {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: "Georgia", sans-serif;
            letter-spacing: 1px;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-family: bright DEMO, Georgia, serif;
            color: #2e4365;
            font-size: 45px;
            margin: 0;
            font-weight: bold;
        }

        /* SECTION DIVIDERS */
        .section-divider {
            width: auto;
            max-width: 250px;
            background: #8a3b08;
            color: #fff;
            padding: 10px 25px;
            font-size: 20px;
            margin: 20px 0 10px 0;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            grid-column: 1 / -1;
        }

        /* BUTTONS */
        .header-buttons {
            display: flex;
            gap: 12px;
        }

        .play-button,
        .flip-button,
        .nav-btn,
        .back-btn {
            padding: 10px 18px;
            font-family: inherit;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .play-button,
        .nav-btn {
            background-color: #e59d2c;
            color: white;
        }

        .flip-button,
        .back-btn {
            background-color: #2e4365;
            color: white;
        }

        .play-button:hover,
        .nav-btn:hover {
            background-color: #c97f14;
            transform: translateY(-2px);
        }

        .flip-button:hover,
        .back-btn:hover {
            background-color: #1d2f4d;
            transform: translateY(-2px);
        }

        /* FLASHCARDS GRID */
        .flashcards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
        }

        .flashcard {
            height: 165px;
            border: 4px solid #e59d2c;
            border-radius: 22px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard:hover .card-inner,
        .flashcard.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 18px;
            padding: 10px;
        }

        .card-front {
            background-color: #e59d2c;
            border: 4px solid #ffffff;
        }

        .card-back {
            background-color: #ffffff;
            transform: rotateY(180deg);
        }

        .card-front .upper-text {
            font-size: 1.4em;
            font-weight: bold;
            color: #ffffff;
        }

        .card-back .upper-text {
            font-size: 1.4em;
            font-weight: bold;
            color: #6a2d04;
        }

        .card-front .separator {
            width: 60%;
            margin: 8px auto;
            border-top: 2px solid #f3d2a2;
        }

        .card-back .separator {
            width: 60%;
            margin: 8px auto;
            border-top: 2px solid #e8c9a6;
        }

        .card-front .lower-text {
            font-size: 0.9em;
            color: #fff5e6;
            font-style: italic;
        }

        .card-back .lower-text {
            font-size: 0.9em;
            color: #8a3b08;
            font-style: italic;
        }

        /* DETAILS SECTION */
        .details-section {
            display: none;
            max-width: 1000px;
            margin: 30px auto;
            position: relative;
        }

        .main-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 40px;
            border: 4px solid #8a3b08;
            border-radius: 25px;
            padding: 50px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .dialect-word {
            font-size: 48px;
            font-weight: bold;
            color: #2e4365;
            margin-bottom: 20px;
        }

        .tagalog-word {
            font-size: 22px;
            color: #8a3b08;
            margin: 15px 0;
            margin-bottom: 10px;
        }

        .image-container {
            flex: 1;
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            background: #eee;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: inherit;
        }

        .english-container {
            margin-top: 20px;
            border: 3px solid #2e4365;
            border-radius: 18px;
            padding: 15px;
            background: #f5f5f5;
            font-size: 18px;
            line-height: 1.6;
        }

        .example-text {
            font-size: 18px;
            color: #444;
            line-height: 1.6;
            border-left: 4px solid #e59d2c;
            padding-left: 15px;
            margin-top: 10px;
        }

        .pronunciation-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            font-size: 18px;
            font-style: italic;
            color: #555;
            margin: 8px 0;
        }

        .audio-icon {
            font-size: 28px;
            color: #e59d2c;
            cursor: pointer;
            transition: 0.3s;
        }

        .audio-icon:hover {
            color: #2e4365;
            transform: scale(1.1);
        }

        .button-group {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .back-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .learning-center{
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:5px;
        }

        #learnStatus{
            font-size:13px;
            color:#666;
        }
    </style>
</head>

    <script>
        let words = [];

    const container = document.getElementById("flashcards");
    let currentIndex = 0;
    let lastCat = "";
    let learnedWords = new Set();

        async function loadWords() {
            container.textContent = "Loading words...";

            try {
                const response = await fetch(
                    "../api/words.php?dialect=Kapampangan"
                );

                const data = await response.json();

                if (!response.ok || !Array.isArray(data)) {
                    throw new Error(data.error || "Unable to load words.");
                }

                data.sort((a, b) =>
                    Number(a.category_id) - Number(b.category_id) ||
                    Number(a.word_id) - Number(b.word_id)
                );

                words = data.map(w => ({
                    cat: w.category_name,
                    dialect: w.word,
                    pron: w.pronunciation,
                    tagalog: w.tagalog,
                    english: w.english,
                    example: w.example,
                    image: "../" + w.image_path,
                    audio: "../" + w.audio_path
                }));

                container.textContent = "";
                lastCat = "";

                if (!words.length) {
                    container.textContent = "No Kapampangan words found.";
                    return;
                }

                renderFlashcards();
            } catch (error) {
                container.textContent =
                    "Unable to load words. Check the PHP endpoint.";
                console.error(error);
            }
        }

        function escapeHTML(text) {
            const span = document.createElement("span");
            span.textContent = text ?? "";
            return span.innerHTML;
        }

        // Render Grid
        function renderFlashcards() {
            words.forEach((w, i) => {
                if (w.cat !== lastCat) {
                    const div = document.createElement("div");
                    div.className = "section-divider";
                    div.innerHTML = `
                    <span class="material-icons">label</span>
                    ${escapeHTML(w.cat)}
                `;
                    container.appendChild(div);
                    lastCat = w.cat;
                }

                const card = document.createElement("div");
                card.className = "flashcard";
                card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <div class="upper-text">${escapeHTML(w.dialect)}</div>
                        <div class="separator"></div>
                        <div class="lower-text">[ ${escapeHTML(w.pron)} ]</div>
                    </div>
                    <div class="card-back">
                        <div class="upper-text">${escapeHTML(w.tagalog)}</div>
                        <div class="separator"></div>
                        <div class="lower-text">${escapeHTML(w.english)}</div>
                    </div>
                </div>
            `;

                card.onclick = () => {
                    currentIndex = i;
                    showDetails();
                };

                container.appendChild(card);
            });
        }
